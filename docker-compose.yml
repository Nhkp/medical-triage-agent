services:
  vllm:
    profiles: [gpu]
    image: vllm/vllm-openai:v0.10.2
    command: ["--model", "${VLLM_MODEL_ID:-Qwen/Qwen3-1.7B-Base}", "--revision", "ea980cb0a6c2ae4b936e82123acc929f1cec04c1", "--dtype", "half", "--chat-template", "/app/chat_template.jinja"]
    volumes:
      - ./configs/chat_template.jinja:/app/chat_template.jinja:ro
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: ["gpu"]

  api:
    profiles: [gpu]
    build: .
    environment:
      VLLM_BASE_URL: ${COMPOSE_VLLM_BASE_URL:-http://vllm:8000/v1}
      VLLM_MODEL_ID: ${VLLM_MODEL_ID:-Qwen/Qwen3-1.7B-Base}
      VLLM_STRUCTURED_OUTPUT: ${VLLM_STRUCTURED_OUTPUT:-guided_json}
      VLLM_MAX_TOKENS: ${VLLM_MAX_TOKENS:-256}
      VLLM_TIMEOUT_SECONDS: ${VLLM_TIMEOUT_SECONDS:-30}
      API_KEY: ${API_KEY:-}
    ports:
      - "8080:8080"
    depends_on:
      - vllm
